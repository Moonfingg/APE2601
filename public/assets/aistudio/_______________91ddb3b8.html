<style>
/* Layout: pure black stage, one glowing button at the centre; it opens a frosted glass window ringed by sparkling flowers drawn on a canvas around its edge. */
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root {
  color-scheme: dark;
  --bg: #000000;
  --ink: #f6f0fc;
  --mute: rgba(246, 240, 252, .62);
  --rose: #ff7ab8;
  --violet: #a78bfa;
  --cyan: #5ee7ff;
  --gold: #ffd479;
  --line: rgba(255, 255, 255, .13);
  --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  display: grid;
  place-items: center;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

/* Shared animated gradient border */
.ring { position: relative; }
.ring::before {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from var(--ang), var(--rose), var(--violet), var(--cyan), var(--gold), var(--rose));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 9s linear infinite;
}
@keyframes spin { to { --ang: 360deg; } }

/* Centre button */
.open-btn {
  background: rgba(255, 255, 255, .02);
  border: 0; border-radius: 999px;
  padding: 20px 52px;
  font-family: var(--display); font-style: italic; font-weight: 600;
  font-size: clamp(26px, 5vw, 34px); line-height: 1; letter-spacing: .04em;
  box-shadow: 0 0 30px rgba(255, 122, 184, .22), 0 0 70px rgba(167, 139, 250, .16), inset 0 0 22px rgba(167, 139, 250, .14);
  transition: transform .4s cubic-bezier(.2, .8, .2, 1), box-shadow .4s, opacity .45s;
  animation: breathe 4.5s ease-in-out infinite;
}
.open-btn:hover { transform: scale(1.05); box-shadow: 0 0 44px rgba(255, 122, 184, .36), 0 0 100px rgba(167, 139, 250, .26), inset 0 0 26px rgba(167, 139, 250, .2); }
.open-btn:active { transform: scale(.98); }
.open-btn.away { opacity: 0; pointer-events: none; transform: scale(.9); }
@keyframes breathe { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }

/* Flower canvas + scrim */
#fx { position: fixed; left: 0; top: 0; z-index: 1; pointer-events: none; }
.scrim { position: fixed; inset: 0; z-index: 2; background: transparent; }

/* Glass window */
.win {
  position: fixed; inset: 0; margin: auto; z-index: 3;
  width: min(560px, calc(100% - 2 * max(28px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px))));
  height: min(700px, calc(100% - 96px));
  border-radius: 28px;
  display: flex; flex-direction: column;
  background: linear-gradient(160deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03));
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  backdrop-filter: blur(16px) saturate(150%);
  box-shadow: 0 0 60px rgba(167, 139, 250, .24), 0 0 130px rgba(255, 122, 184, .13), inset 0 1px 0 rgba(255, 255, 255, .2);
  opacity: 0; transform: scale(.9) translateY(14px);
  transition: opacity .6s cubic-bezier(.2, .8, .2, 1), transform .7s cubic-bezier(.2, .8, .2, 1);
  outline: none;
}
.win.show { opacity: 1; transform: none; }

.top { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 0 24px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.top .clock { font-variant-numeric: tabular-nums; color: var(--ink); margin-left: 10px; letter-spacing: .08em; }
.close { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); display: grid; place-items: center; transition: background .25s, transform .25s; }
.close:hover { background: rgba(255, 255, 255, .12); transform: rotate(90deg); }

.head { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 6px; padding: 8px 14px 4px; text-align: center; }
.nav { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); display: grid; place-items: center; transition: background .25s, box-shadow .25s, transform .2s; }
.nav:hover { background: rgba(255, 255, 255, .12); box-shadow: 0 0 22px rgba(94, 231, 255, .3); }
.nav:active { transform: scale(.92); }
.dow {
  font-family: var(--display); font-style: italic; font-weight: 600;
  font-size: clamp(32px, 8vw, 42px); line-height: 1.05; text-wrap: balance;
  background: linear-gradient(100deg, var(--rose), var(--violet) 55%, var(--cyan));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--ink);
}
.sub { font-size: 13px; color: var(--mute); margin-top: 4px; font-variant-numeric: tabular-nums; }
.swap-r { animation: swapR .45s cubic-bezier(.2, .8, .2, 1) both; }
.swap-l { animation: swapL .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes swapR { from { opacity: 0; transform: translateX(18px); } }
@keyframes swapL { from { opacity: 0; transform: translateX(-18px); } }

.pills { display: flex; gap: 6px; justify-content: center; padding: 8px 16px 12px; }
.pill { position: relative; flex: 1 1 0; min-width: 0; max-width: 48px; height: 34px; border-radius: 12px; border: 1px solid transparent; background: transparent; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--mute); transition: background .25s, color .25s, border-color .25s, box-shadow .25s; }
.pill.off { opacity: .6; }
.pill:hover { color: var(--ink); background: rgba(255, 255, 255, .06); }
.pill.on { color: var(--ink); background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .24); box-shadow: 0 0 18px rgba(255, 122, 184, .25); opacity: 1; }
.pill.today::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }

.list {

  padding: 4px 16px 34px; display: flex; flex-direction: column; gap: 10px;
  -webkit-mask-image: linear-gradient(#000 calc(100% - 30px), transparent);
  mask-image: linear-gradient(#000 calc(100% - 30px), transparent);
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent;
}
.lesson {
  position: relative; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 14px; align-items: start;
  padding: 14px 16px 16px; border-radius: 18px;
  background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .09);
  animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 70ms);
  transition: opacity .4s, border-color .4s, background .4s, box-shadow .4s;

.list.still .lesson { animation: none; }
@keyframes rise { from { opacity: 0; transform: translateX(var(--dx, 0px)) translateY(10px); } }
.lesson .num { position: absolute; right: 14px; top: 2px; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 56px; line-height: 1; color: rgba(255, 255, 255, .07); pointer-events: none; }
.time b { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.time span { display: block; margin-top: 2px; font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.info { min-width: 0; border-left: 1px solid var(--line); padding-left: 14px; }
.name { font-size: 15.5px; font-weight: 600; line-height: 1.3; text-wrap: balance; padding-right: 22px; }
.room { margin-top: 3px; font-size: 13px; color: var(--mute); }
.meta { margin-top: 9px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.chip { --c: 255, 122, 184; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgb(var(--c)); background: rgba(var(--c), .12); border: 1px solid rgba(var(--c), .38); }
.chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: rgb(var(--c)); box-shadow: 0 0 8px rgb(var(--c)); }
.chip.lec { --c: 167, 139, 250; }
.chip.prac { --c: 94, 231, 255; }
.state { font-size: 12px; color: var(--mute); }
.lesson.past { opacity: .42; }
.lesson.now { border-color: rgba(255, 122, 184, .6); background: rgba(255, 122, 184, .09); box-shadow: 0 0 30px rgba(255, 122, 184, .22); }
.lesson.now .state { color: var(--rose); font-weight: 600; }
.lesson.next { border-color: rgba(94, 231, 255, .42); }
.lesson.next .state { color: var(--cyan); font-weight: 600; }
.prog { position: absolute; left: 16px; right: 16px; bottom: 7px; height: 2px; border-radius: 2px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.prog u { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--gold)); transition: width 1s linear; }

.rest { text-align: center; padding: 34px 12px; animation: rise .6s both; }
.rest h3 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 600; font-size: 52px; line-height: 1.05; background: linear-gradient(100deg, var(--gold), var(--rose), var(--violet)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--ink); }
.rest p { margin: 14px auto 0; max-width: 34ch; font-size: 14px; line-height: 1.5; color: var(--mute); text-wrap: balance; }
.rest p b { color: var(--ink); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .ring::before, .open-btn, .lesson, .rest, .swap-r, .swap-l { animation: none; }
  .win, .prog u { transition: none; }
}

  </div>
  <div class="head">
    <button class="nav" id="prev" type="button" aria-label="Предыдущий день">

    </button>

  <ol class="list" id="list" aria-live="polite"></ol>
</section>

      var nx = nextLesson(n), when = '';
      if (nx) when = (nx.k === 0 ? 'Сегодня' : nx.k === 1 ? 'Завтра' : DAYS[nx.idx].g.charAt(0).toUpperCase() + DAYS[nx.idx].g.slice(1)) + ' в ' + nx.l.a;
      html = '<li class="rest"><h3>Выходной</h3><p>' + (nx ? 'Ближайшая пара: <b>' + when + '</b>, ' + nx.l.t + '.' : 'Пар нет.') + '</p></li>';
    } else {
      lessons.forEach(function (l, i) {
        var s = st[i] || '', label = '';
        if (s === 'now') label = 'Идёт сейчас · ещё ' + dur(toMin(l.b) - n.min);
        else if (s === 'next') label = 'Следующая · через ' + dur(toMin(l.a) - n.min);
        var chip = l.k ? '<span class="chip ' + (l.k === LEC ? 'lec' : 'prac') + '">' + l.k + '</span>' : '<span class="chip">Занятие</span>';
        html += '<li class="lesson ' + s + '" style="--i:' + i + '">' +
          '<span class="num" aria-hidden="true">' + (i + 1) + '</span>' +
          '<div class="time"><b>' + l.a + '</b><span>' + l.b + '</span></div>' +
          '<div class="info"><div class="name">' + l.t + '</div><div class="room">' + l.r + '</div>' +
          '<div class="meta">' + chip + (label ? '<span class="state">' + label + '</span>' : '') + '</div></div>' +
          (s === 'now' ? '<i class="prog"><u data-i="' + i + '" style="width:' + pct(n, l).toFixed(1) + '%"></u></i>' : '') +
          '</li>';
      });
    }
    var top = list.scrollTop;
    list.style.setProperty('--dx', (dir > 0 ? 26 : dir < 0 ? -26 : 0) + 'px');
    list.classList.toggle('still', !animate);
    list.innerHTML = html;
    list.scrollTop = keepScroll ? top : 0;
    lastSig = sigFor(n);
  }
  function sigFor(n) { return n.wd + '|' + view + '|' + (view === n.wd ? n.min : '-'); }

  function go(delta) { view = (view + delta + 7) % 7; render(true, false, delta); tickSound(delta > 0); }

  setInterval(function () {
    if (!isOpen) return;
    var n = now();
    clock.textContent = pad(n.h) + ':' + pad(n.m) + ':' + pad(n.s);
    if (sigFor(n) !== lastSig) { render(false, true, 0); return; }
    if (view === n.wd) {
      var bars = list.querySelectorAll('.prog u');
      for (var i = 0; i < bars.length; i++) bars[i].style.width = pct(n, SCHEDULE[view][+bars[i].getAttribute('data-i')]).toFixed(1) + '%';
    }
  }, 1000);

  /* ---------- open / close ---------- */
  function open() {
    if (isOpen) return;
    var n = now(); view = n.wd; render(false, false, 0);
    clock.textContent = pad(n.h) + ':' + pad(n.m) + ':' + pad(n.s);
    win.hidden = false; scrim.hidden = false;
    isOpen = true;
    seed(); openAt = performance.now() / 1000;
    if (!raf) raf = requestAnimationFrame(frame);
    requestAnimationFrame(function () { win.classList.add('show'); });
    btn.classList.add('away');
    chimeOpen();
    try { win.focus({ preventScroll: true }); } catch (e) {}
  }
  function close() {
    if (!isOpen) return;
    isOpen = false; win.classList.remove('show'); btn.classList.remove('away'); chimeClose();
    setTimeout(function () { if (!isOpen) { win.hidden = true; scrim.hidden = true; } }, 650);
    try { btn.focus({ preventScroll: true }); } catch (e) {}
  }

  btn.addEventListener('click', open);
  $('closeBtn').addEventListener('click', close);
  scrim.addEventListener('click', close);
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  document.addEventListener('keydown', function (e) {
    if (!isOpen) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
  });
  var tx = null;
  win.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  win.addEventListener('touchend', function (e) {
    if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- flowers & sparkles (canvas) ---------- */
  var cv = $('fx'), c = cv.getContext('2d');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dpr = 1, vw = 0, vh = 0, flowers = [], sparks = [], alpha = 0, openAt = 0, raf = 0;
  var PALETTE = ['255,122,184', '167,139,250', '94,231,255', '255,212,121', '255,138,107', '123,242,192', '232,220,255'];

  function sizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2); vw = window.innerWidth; vh = window.innerHeight;
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr); cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function makeSprite(size, col, petals, slim) {
    var S = Math.ceil(size * 4 * dpr), sc = document.createElement('canvas'); sc.width = sc.height = S;
    var g = sc.getContext('2d'); g.scale(dpr, dpr); g.translate(size * 2, size * 2);
    g.shadowColor = 'rgba(' + col + ',.9)'; g.shadowBlur = size * 0.9;
    var len = size * 0.98, wid = size * (slim ? 0.17 : 0.3);
    for (var k = 0; k < petals; k++) {
      g.save(); g.rotate(k * 2 * Math.PI / petals);
      var gr = g.createLinearGradient(0, 0, 0, -len);
      gr.addColorStop(0, 'rgba(255,255,255,.92)'); gr.addColorStop(0.35, 'rgba(' + col + ',.95)'); gr.addColorStop(1, 'rgba(' + col + ',.55)');
      g.beginPath(); g.moveTo(0, 0);
      g.bezierCurveTo(wid * 1.6, -len * 0.25, wid * 1.2, -len * 0.95, 0, -len);
      g.bezierCurveTo(-wid * 1.2, -len * 0.95, -wid * 1.6, -len * 0.25, 0, 0);
      g.fillStyle = gr; g.fill(); g.lineWidth = 0.6; g.strokeStyle = 'rgba(255,255,255,.35)'; g.stroke();
      g.restore();
    }
    g.shadowColor = 'rgba(255,212,121,1)'; g.shadowBlur = size * 0.6;
    g.beginPath(); g.arc(0, 0, size * 0.14, 0, 6.2832); g.fillStyle = 'rgba(255,240,180,1)'; g.fill();
    g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,.95)';
    for (var j = 0; j < 6; j++) { var an = j * 1.0472; g.beginPath(); g.arc(Math.cos(an) * size * 0.22, Math.sin(an) * size * 0.22, size * 0.03, 0, 6.2832); g.fill(); }
    return sc;
  }

  function seed() {
    sizeCanvas();
    var w = win.offsetWidth, h = win.offsetHeight, P = 2 * (w + h);
    var k = Math.max(0.62, Math.min(1.05, vw / 560)), n = Math.round(P / (46 * k));
    flowers = []; sparks = [];
    function add(t, size, delay, off) {
      var col = pick(PALETTE), petals = pick([5, 5, 6, 7, 8]), slim = petals >= 7;
      flowers.push({ t: t, off: off, size: size, spr: makeSprite(size, col, petals, slim), rot0: rnd(0, 6.28), spin: rnd(-0.22, 0.22), ph: rnd(0, 6.28), delay: delay });
    }
    for (var i = 0; i < n; i++) add((i + rnd(-0.25, 0.25)) / n, rnd(10, 23) * k, rnd(0.05, 0.9) + i / n * 0.7, rnd(-2, 12) * k);
    [0, w / P, (w + h) / P, (2 * w + h) / P].forEach(function (t, i) { add(t, rnd(27, 33) * k, i * 0.08, 6 * k); });
    var ns = Math.round(P / 9);
    for (var s = 0; s < ns; s++) sparks.push({ t: Math.random(), off: rnd(-4, 70) * k, ph: rnd(0, 6.28), sp: rnd(1.1, 2.8), sz: rnd(3, 8) * k });
  }

  function onPerim(t, w, h, x0, y0) {
    var P = 2 * (w + h), d = (((t % 1) + 1) % 1) * P;
    if (d < w) return [x0 + d, y0, 0, -1];
    d -= w; if (d < h) return [x0 + w, y0 + d, 1, 0];
    d -= h; if (d < w) return [x0 + w - d, y0 + h, 0, 1];
    d -= w; return [x0, y0 + h - d, -1, 0];
  }
  function easeBack(x) { x = Math.max(0, Math.min(1, x)); var c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

  function frame(ts) {
    raf = requestAnimationFrame(frame);
    var t = ts / 1000;
    alpha += ((isOpen ? 1 : 0) - alpha) * 0.07;
    if (!isOpen && alpha < 0.01) { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); cancelAnimationFrame(raf); raf = 0; return; }
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, vw, vh);
    var w = win.offsetWidth, h = win.offsetHeight, x0 = (vw - w) / 2, y0 = (vh - h) / 2, P = 2 * (w + h);
    c.globalCompositeOperation = 'lighter';

    /* vine */
    var prog = Math.max(0, Math.min(1, (t - openAt) / 1.4));
    c.globalAlpha = alpha * 0.5; c.lineWidth = 1.2; c.strokeStyle = 'rgba(123,242,192,.55)'; c.shadowColor = 'rgba(123,242,192,.8)'; c.shadowBlur = 8;
    c.beginPath();
    var steps = Math.round(P / 5 * prog);
    for (var i = 0; i <= steps; i++) {
      var tt = i / (P / 5), p = onPerim(tt, w, h, x0, y0), o = 4 + 3.5 * Math.sin(tt * P / 24 + t * 0.6);
      var px = p[0] + p[2] * o, py = p[1] + p[3] * o;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.stroke(); c.shadowBlur = 0;

    /* flowers */
    for (var f = 0; f < flowers.length; f++) {
      var fl = flowers[f], age = t - openAt - fl.delay; if (age <= 0) continue;
      var b = reduced ? 1 : easeBack(age / 1.1), q = onPerim(fl.t, w, h, x0, y0);
      var sc = Math.max(0, b) * (reduced ? 1 : 1 + 0.045 * Math.sin(t * 1.3 + fl.ph));
      c.save(); c.translate(q[0] + q[2] * fl.off, q[1] + q[3] * fl.off);
      c.rotate(fl.rot0 + (reduced ? 0 : t * fl.spin) - (1 - Math.min(1, b)) * 1.4); c.scale(sc, sc);
      c.globalAlpha = alpha * Math.min(1, age * 2) * (reduced ? 0.9 : 0.8 + 0.2 * Math.sin(t * 2 + fl.ph));
      c.drawImage(fl.spr, -fl.size * 2, -fl.size * 2, fl.size * 4, fl.size * 4);
      c.restore();
    }

    /* sparkles */
    c.lineWidth = 1; c.lineCap = 'round';
    for (var s = 0; s < sparks.length; s++) {
      var sp = sparks[s], v = reduced ? 0.5 : Math.pow(Math.max(0, Math.sin(t * sp.sp + sp.ph)), 7);
      if (v < 0.03) continue;
      var r = onPerim(sp.t + Math.sin(t * 0.07 + sp.ph) * 0.004, w, h, x0, y0), x = r[0] + r[2] * sp.off, y = r[1] + r[3] * sp.off, L = sp.sz * (0.5 + v);
      c.globalAlpha = alpha * v; c.strokeStyle = 'rgba(255,246,255,1)';
      c.beginPath(); c.moveTo(x - L, y); c.lineTo(x + L, y); c.moveTo(x, y - L); c.lineTo(x, y + L); c.stroke();
      c.beginPath(); c.arc(x, y, L * 0.3, 0, 6.2832); c.fillStyle = 'rgba(255,225,245,1)'; c.fill();
    }
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  }

  var rz = 0;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (isOpen) seed(); else sizeCanvas(); }, 150); });

  buildPills();
  sizeCanvas();
})();
</script>

</body></html>
