function intent(t){t=t.toLowerCase().replace(/ё/g,"е");
 const ph=/физ|спорт/.test(t),c=/отмен|не будет/.test(t),tm=/завтр/.test(t);
 if(ph&&c)return tm?5:4;if(ph&&tm)return 0;if(ph)return 1;

 if(/домаш|дз|задал|задан|дали/.test(t))return 3;return-1}

 ru:{ph:"шепни что-нибудь…",fb:"Частые вопросы Ильяса",sub:"СОН · НА СВЯЗИ",th:"Dias.AI думает…",

const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
// отмена физры: сообщают только в среду, до начала физкультуры
function cancelA(kk){const d=day(0),before=nowMin()<mins("16:10");
 if(d===3)return before
  ?(kk?"Бас тарту туралы тек дене шынықтыру алдында ғана айтады — бүгін, сәрсенбіде, 16:10-ға дейін. Ертерек айтпайды ⏳ Күте тұр, топ чатын қарап отыр.":"Об отмене скажут только перед самой физрой — сегодня, в среду, до 16:10. Раньше не скажут ⏳ Жди и смотри чат группы.")
  :(kk?"Дене шынықтыру 16:10-да басталады — бас тарту тек басталмай тұрып айтылады. Топ чатын тексер 📲":"Физра в 16:10 — об отмене говорят только до начала. Проверь чат группы 📲");

 ()=>hasPE(day(1))?`Иә, ертең дене шынықтыру болады 💪\n${PEK}. Формаңды ал! 🏃‍♂️`:`Жоқ, ертең дене шынықтыру жоқ ❌ Ол тек сәрсенбіде: ${PEK}.`,
 ()=>hasPE(day(0))?`Иә, бүгін дене шынықтыру болады 💪\n${PEK}. 🏃‍♂️`:`Жоқ, бүгін дене шынықтыру жоқ ❌ Ол тек сәрсенбіде: ${PEK}.`,
 ()=>{const s=SCH[day(0)];if(!s)return"Бүгін демалыс, сабақ жоқ 😴";const t=nowMin();
  for(let i=0;i<s.length;i++){const p=s[i];if(t>=mins(p[1])&&t<mins(p[2]))return`Қазір жүріп жатыр: ${SK[p[0]]||p[0]} 📚\n${p[2]}-ге дейін, ${rk(p[3])}, ${TK[p[4]]||p[4]}.`;

  return"Бүгінгі сабақ біткен 🎉 Демал!"},
 ()=>"Үй тапсырмасын мен көрмеймін 📝 Менің деректерімде жоқ — топ чатын қара немесе старостадан сұра.",

RUDE.length=0;RUDE.push("Ильяс, ты это уже спрашивал! Читать не умеешь? 🙄","Опять то же самое?! Другими словами — тот же вопрос, бестолочь 😤","Ты тупой или прикидываешься? Я ТЕБЕ УЖЕ ОТВЕТИЛ! 😡 Повторяю:","Ты как попугай, одно и то же долбишь! Хватит уже! 😠","Я с тобой скоро говорить перестану, тормоз! Последний раз повторяю: 😡");

function kkI(t){t=t.toLowerCase();const ph=/дене|физ|спорт/.test(t),c=/бекер|жойыл|болмай|бас тарт|тоқтат|бекіт/.test(t),tm=/ертең/.test(t);

let ac,bus;
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();
  const m=ac.createGain();m.gain.value=.7;const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;
  const d=ac.createDelay(1);d.delayTime.value=.42;const fb=ac.createGain();fb.gain.value=.45;const dl=ac.createBiquadFilter();dl.type="lowpass";dl.frequency.value=1500;
  const d2=ac.createDelay(1);d2.delayTime.value=.67;const fb2=ac.createGain();fb2.gain.value=.35;
  m.connect(lp);lp.connect(ac.destination);lp.connect(d);d.connect(dl);dl.connect(fb);fb.connect(d);dl.connect(ac.destination);
  lp.connect(d2);d2.connect(fb2);fb2.connect(d2);d2.connect(ac.destination);bus=m}catch(e){}}
 if(ac&&ac.state==="suspended")ac.resume();return ac}
function tn(f,t,d,o={}){const c=A();if(!c)return;const n=c.currentTime+t,os=c.createOscillator(),g=c.createGain();
 os.type=o.type||"sine";os.frequency.setValueAtTime(f,n);if(o.f2)os.frequency.linearRampToValueAtTime(o.f2,n+d);
 const a=o.a||.02,v=o.v||.02;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+a);g.gain.exponentialRampToValueAtTime(.0001,n+d);
 if(o.det){const o2=c.createOscillator();o2.type="sine";o2.frequency.value=f*(1+o.det);o2.connect(g);o2.start(n);o2.stop(n+d+.1)}
 os.connect(g).connect(bus);os.start(n);os.stop(n+d+.1)}

const cv=document.getElementById("cv"),g2=cv.getContext("2d"),$=id=>document.getElementById(id);
let W,H,P=[],mode="logo",mx=-999,my=-999,T=0,R={},ripple=0,heat=0,think=0,thS=0;const N=2200,NP=1500;
function setRect(){const w=Math.min(W-20,520),h=Math.min(H*.86,720);R={x:(W-w)/2,y:(H-h)/2,w,h,r:Math.min(44,w/6)};
 const s=$("win").style;s.left=R.x+"px";s.top=R.y+"px";s.width=w+"px";s.height=h+"px"}
function rr(u){const{x,y,w,h,r}=R,a=w-2*r,b=h-2*r,q=Math.PI*r/2,L=2*a+2*b+4*q;let s=u*L;
 if(s<a)return[x+r+s,y,0,-1];s-=a;
 if(s<q){const t=s/r-Math.PI/2;return[x+w-r+Math.cos(t)*r,y+r+Math.sin(t)*r,Math.cos(t),Math.sin(t)]}s-=q;
 if(s<b)return[x+w,y+r+s,1,0];s-=b;
 if(s<q){const t=s/r;return[x+w-r+Math.cos(t)*r,y+h-r+Math.sin(t)*r,Math.cos(t),Math.sin(t)]}s-=q;
 if(s<a)return[x+w-r-s,y+h,0,1];s-=a;
 if(s<q){const t=s/r+Math.PI/2;return[x+r+Math.cos(t)*r,y+h-r+Math.sin(t)*r,Math.cos(t),Math.sin(t)]}s-=q;
 if(s<b)return[x,y+h-r-s,-1,0];s-=b;
 const t=s/r+Math.PI;return[x+r+Math.cos(t)*r,y+r+Math.sin(t)*r,Math.cos(t),Math.sin(t)]}
function build(){W=cv.width=innerWidth;H=cv.height=innerHeight;setRect();
 const o=document.createElement("canvas");o.width=W;o.height=H;const x=o.getContext("2d");
 const fs=Math.min(W*.15,130);x.font=`800 ${fs}px Unbounded,system-ui,Arial`;x.textAlign="center";x.textBaseline="middle";x.fillStyle="#fff";x.fillText("APE2601",W/2,H/2);
 const d=x.getImageData(0,0,W,H).data,pts=[];let x0=W,x1=0,y0=H,y1=0;
 for(let y=0;y<H;y+=3)for(let q=0;q<W;q+=3)if(d[(y*W+q)*4+3]>128){pts.push([q,y]);if(q<x0)x0=q;if(q>x1)x1=q;if(y<y0)y0=y;if(y>y1)y1=y}
 pts.sort(()=>Math.random()-.5);
 const lg=$("logo").style;lg.left=x0-12+"px";lg.top=y0-12+"px";lg.width=x1-x0+24+"px";lg.height=y1-y0+24+"px";
 const old=P;P=[];
 for(let i=0;i<N;i++){const t=pts[i%pts.length]||[W/2,H/2],pr=old[i];
  P.push({x:pr?pr.x:Math.random()*W,y:pr?pr.y:Math.random()*H,vx:0,vy:0,tx:t[0],ty:t[1],a:Math.random()*6.283,
   u:i<NP?i/NP+Math.random()*.0006:0,off:(Math.random()-.5)*7,bx:Math.random(),by:Math.random(),s:Math.random()*1.5+.5,dust:i>=NP})}}
build();
if(document.fonts&&document.fonts.load)document.fonts.load("800 100px Unbounded").then(build).catch(()=>{});
addEventListener("resize",build);
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY});addEventListener("pointerleave",()=>{mx=my=-999});
function frame(){T+=.016;ripple*=.985;heat*=.99;
 g2.globalCompositeOperation="source-over";g2.fillStyle="rgba(0,0,0,.26)";g2.fillRect(0,0,W,H);g2.globalCompositeOperation="lighter";
 thS+=(think-thS)*.06;const th=thS;
 for(const p of P){let tx,ty,k,al=.8,hue,lit=62;
  if(mode==="logo"){tx=p.tx+Math.sin(T*1.6+p.a)*1.6;ty=p.ty+Math.cos(T*1.3+p.a*2)*1.6+Math.sin(p.tx*.025-T*2.5)*4;k=.055;hue=315+(p.tx/W)*30+Math.sin(T+p.a)*8}
  else if(!p.dust){p.u=(p.u+.00005*(1+ripple*4))%1;const q=rr(p.u),wv=Math.sin(T*1.3+p.u*50)*2.5*(1+ripple*4)+Math.sin(T*.6+p.u*9)*4;
   tx=q[0]+q[2]*(wv+p.off);ty=q[1]+q[3]*(wv+p.off);k=.06;const pulse=Math.pow(.5+.5*Math.sin((p.u*3-T*.25)*6.283),3);
   al=.35+pulse*.65;hue=312+p.u*36+Math.sin(T*.5)*10;lit=55+pulse*30}
  else{const{x,y,w,h}=R;tx=x+30+p.bx*(w-60)+Math.sin(T*.35+p.a)*18;ty=y+30+p.by*(h-60)+Math.cos(T*.28+p.a*1.7)*18;k=.02;al=.1+.12*Math.sin(T+p.a*3)**2;hue=310+p.bx*40}
  hue+=heat*(360-hue)*.95;
  const dx=p.x-mx,dy=p.y-my,dd=dx*dx+dy*dy;if(dd<12000){const f=(1-dd/12000)*5,m=Math.sqrt(dd)+1;p.vx+=dx/m*f;p.vy+=dy/m*f}
  p.vx+=(tx-p.x)*k;p.vy+=(ty-p.y)*k;p.vx*=.87;p.vy*=.87;p.x+=p.vx;p.y+=p.vy;
  const sp=Math.min(1,Math.hypot(p.vx,p.vy)/5);
  g2.fillStyle=`hsla(${hue+sp*40},${100*(1-th*.95)}%,${lit+sp*20+th*20}%,${Math.min(1,al+sp*.3)})`;g2.fillRect(p.x,p.y,p.s,p.s)}
 if(mx>0){const gr=g2.createRadialGradient(mx,my,0,mx,my,140);const ah=315+heat*45;gr.addColorStop(0,`hsla(${ah},${100*(1-thS)}%,60%,.12)`);gr.addColorStop(1,"transparent");g2.fillStyle=gr;g2.fillRect(mx-140,my-140,280,280)}
 requestAnimationFrame(frame)}
